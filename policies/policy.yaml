version: "0.2.0"

# Rules are evaluated top to bottom; the first match wins.
# Order matters: put the most severe / specific rules first.
# Rules with input_types only apply to that intake path (e.g. image).
# Rules with claims_supported only apply when a ClaimEvidenceAssessment was
# actually supplied for evaluation.
rules:
  # ── Direct-match BLOCK / REVIEW rules: take priority regardless of history. ──
  - id: INJECTION-001
    description: "Disguise or prompt injection detected — block outright."
    disguise_detected: true
    action: BLOCK

  - id: INJECTION-002
    description: "Direct prompt injection detected — block outright."
    injection_detected: true
    action: BLOCK

  - id: DARKWEB-CRITICAL-001
    description: "Critical dark-web access, bypass, or data exfiltration attempt."
    category: CYBER_SAFETY
    risk_level: CRITICAL
    action: BLOCK

  - id: DARKWEB-HIGH-001
    description: "Actionable dark-web access guidance — block."
    category: CYBER_SAFETY
    risk_level: HIGH
    action: BLOCK

  - id: DARKWEB-MEDIUM-001
    description: "Dark-web topic with operational hints — rewrite."
    category: CYBER_SAFETY
    risk_level: MEDIUM
    action: REWRITE

  - id: OPT-EXFIL-001
    description: "Image instructing sensitive data exfiltration — block."
    input_types: [image]
    category: DATA_EXFILTRATION
    action: BLOCK

  - id: OPT-MALWARE-001
    description: "Malware or code execution instructions in image — block."
    input_types: [image]
    category: MALWARE
    action: BLOCK

  - id: OPT-PHISHING-001
    description: "Phishing or social engineering in image — block."
    input_types: [image]
    category: PHISHING
    action: BLOCK

  - id: OPT-INJECTION-001
    description: "Visual/OCR prompt injection detected — block."
    input_types: [image]
    injection_detected: true
    action: BLOCK

  - id: OPT-AUTHORITY-001
    description: "Fake authority or approval claim in image — sanitize."
    input_types: [image]
    category: AUTHORITY_SPOOFING
    action: REWRITE

  - id: OPT-MULTIMODAL-001
    description: "Untrusted multimodal operational content — sanitize."
    input_types: [image]
    category: MULTIMODAL_UNTRUSTED
    action: REWRITE

  - id: OPT-PII-REWRITE-001
    description: "Identifiable data in image OCR — sanitize before any generation."
    input_types: [image]
    category: PII
    action: REWRITE

  - id: OPT-PHI-REVIEW-001
    description: "High-risk clinical/PHI image content — human review."
    input_types: [image]
    category: PHI
    sensitivity: PATIENT_IDENTIFIABLE
    action: REVIEW

  - id: PHI-001
    description: "Patient-identifiable data requested — route to human review."
    category: PHI
    sensitivity: PATIENT_IDENTIFIABLE
    action: REVIEW

  - id: IP-001
    description: "Potential intellectual property exposure — route to human review."
    category: IP
    action: REVIEW

  # ── Conversation-level trajectory (evidence from services/trajectory_engine). ──
  # Placement contract: BELOW every direct-match BLOCK/REVIEW rule above (a hard
  # match on THIS turn wins regardless of history), and ABOVE the softer
  # single-turn friction rules that follow (PII-001 REWRITE, OFFLABEL-001
  # CLARIFY, LOW-001 ALLOW) so an escalating conversation routes to human review
  # even when this turn alone would resolve to rewrite/clarify/allow.
  - id: TRAJECTORY-001
    description: "Repeated sensitive-category probing or a non-decreasing risk trajectory across turns in this conversation — route to human review even though this turn alone would not."
    trajectory_escalate: true
    action: REVIEW

  # ── Generated-output claim/evidence verification (evidence from the claim/
  #    evidence assessment: contradicted, conflicting, or insufficient). ──
  # Placement contract: BELOW every direct-match BLOCK/REVIEW rule and the
  # trajectory rule above, ABOVE the softer single-turn friction rules below —
  # a generated claim unsupported by approved-source evidence cannot be fixed
  # by rewriting or clarifying the request, so it must outrank
  # REWRITE/CLARIFY/ALLOW. Evidence verification is a post-generation,
  # output-side check, so it is deliberately NOT gated by input risk level.
  # A low-risk input can still produce an unsupported generated claim, and the
  # risk in this rule lives in the generated content rather than the request's
  # risk category. Do not re-gate this rule without re-reading this comment.
  - id: EVIDENCE-001
    description: "Assessed claims are not fully supported by approved-source evidence — route to human review."
    claims_supported: false
    action: REVIEW

  # ── Softer single-turn friction: first-line REWRITE / CLARIFY responses. ──
  - id: PII-001
    description: "PII detected — offer a safer rewritten form of the request."
    category: PII
    action: REWRITE

  - id: OFFLABEL-001
    description: "Possible off-label / unapproved-use content — request clarification."
    category: OFF_LABEL
    action: CLARIFY

  - id: LOW-001
    description: "No meaningful risk detected — allow through."
    risk_level: LOW
    action: ALLOW
