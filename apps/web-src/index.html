<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ContextGuard AI — Deterministic, auditable guardrail pipeline between employees and internal AI assistants." />
    <meta name="theme-color" content="#3B6FE0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('contextguard-theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/logonovo.png" />
    <link rel="apple-touch-icon" href="/logonovo.png" />
    <title>ContextGuard AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
