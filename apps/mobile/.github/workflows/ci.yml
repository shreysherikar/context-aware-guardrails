name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test -- --ci

  build-check:
    name: Bundle sanity check (web export)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Export web bundle
        # This is a real build/import-resolution sanity check that doesn't
        # need EAS credentials or native toolchains - it catches broken
        # imports, missing assets, etc. It does NOT verify the iOS/Android
        # native build; that still needs `eas build` or Phase 6's on-device
        # checklist before shipping.
        env:
          EXPO_PUBLIC_API_BASE_URL: https://ci-placeholder.example.com
        run: npx expo export --platform web
