name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --extra desktop --group package
      - run: uv run pyinstaller packaging/contextguard.spec --noconfirm --clean
      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ContextGuard -DestinationPath ContextGuard-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ContextGuard-windows-x64
          path: ContextGuard-windows-x64.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ContextGuard-windows-x64.zip
          prerelease: true
          generate_release_notes: true
