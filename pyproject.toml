[project]
name = "context-aware-guardrail"
version = "0.1.0"
description = "Context-aware adaptive AI guardrail for risk detection and policy enforcement."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "groq>=0.18",
    "python-dotenv>=1.2.3",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "httpx>=0.28.1",
    "ddgs>=9.16.0",
]

[project.optional-dependencies]
optical-tesseract = [
    "pytesseract>=0.3.10",
]
nemo = [
    "nemoguardrails>=0.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "domain*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]

dev = [
    "httpx2>=2.12.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "types-PyYAML",
]
